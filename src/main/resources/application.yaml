spring:
  application:
    name: kafkaavrodemo

  devtools:
    restart:
      enabled: false
    add-properties: false

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          configuration:
            schema.registry.url: ${SPRING_KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}

      bindings:
        # Order Producer (output)
        orderProducer-out-0:
          destination: order-details-topic
          content-type: application/*+avro
          producer:
            useNativeEncoding: true

        # Order Consumer (input)
        orderConsumer-in-0:
          destination: order-details-topic
          content-type: application/*+avro
          group: order-consumer-group
          consumer:
            useNativeDecoding: true

        # TaxLot Producer (output)
        taxLotProducer-out-0:
          destination: taxlot-details-topic
          content-type: application/*+avro
          producer:
            useNativeEncoding: true
            partitionCount: 3

        # TaxLot Consumer (input)
        taxLotConsumer-in-0:
          destination: taxlot-details-topic
          content-type: application/*+avro
          group: taxlot-consumer-group
          consumer:
            useNativeDecoding: true
            concurrency: 3

      # Kafka-specific bindings configuration
      kafka:
        bindings:
          # Order Producer
          orderProducer-out-0:
            producer:
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
                value.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
                schema.registry.url: ${SPRING_KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}

          # Order Consumer
          orderConsumer-in-0:
            consumer:
              configuration:
                key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
                value.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
                specific.avro.reader: true
                schema.registry.url: ${SPRING_KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
                auto.offset.reset: earliest

          # TaxLot Producer
          taxLotProducer-out-0:
            producer:
              configuration:
                key.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
                value.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
                schema.registry.url: ${SPRING_KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}

          # TaxLot Consumer
          taxLotConsumer-in-0:
            consumer:
              configuration:
                key.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
                value.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
                specific.avro.reader: true
                schema.registry.url: ${SPRING_KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
                auto.offset.reset: earliest

      function:
        definition: orderConsumer;taxLotConsumer

server:
  port: 8080

logging:
  level:
    com.ssnc.kafkaavrodemo: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
    org.springframework.cloud.stream: INFO


